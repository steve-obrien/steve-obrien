<div class="flex flex-wrap items-center justify-center gap-2">
	<button
		type="button"
		command="open"
		commandfor="demo-dialog"
		class="inline-flex h-10 items-center rounded-full bg-primary px-4 text-sm font-medium text-primary-foreground hover:opacity-90"
	>
		Open (commandfor)
	</button>
	<button
		type="button"
		id="dialog-open"
		class="inline-flex h-10 items-center rounded-full bg-secondary px-4 text-sm font-medium text-foreground ring-1 ring-border hover:bg-accent"
	>
		Open (script)
	</button>
	<button
		type="button"
		id="dialog-close"
		class="inline-flex h-10 items-center rounded-full px-4 text-sm font-medium text-muted-foreground hover:bg-secondary hover:text-foreground"
	>
		Close
	</button>
</div>

<element-dialog id="demo-dialog">
	<div class="w-[min(92vw,24rem)] rounded-2xl border border-border bg-background p-6 shadow-2xl shadow-black/30 ring-1 ring-border/60">
		<h2 class="text-lg font-semibold tracking-tight text-foreground">No trigger slot</h2>
		<p class="mt-2 text-sm text-muted-foreground">
			Open from a button elsewhere via <code class="text-foreground">commandfor</code> or
			<code class="text-foreground">.open()</code> on the host.
		</p>
		<div class="mt-6 flex justify-end">
			<button
				data-close
				type="button"
				class="inline-flex h-9 items-center rounded-full bg-primary px-4 text-sm font-medium text-primary-foreground hover:opacity-90"
			>
				Done
			</button>
		</div>
	</div>
</element-dialog>

<script type="module">
	import '@elements/headless/dialog.js';

	const dialog = document.getElementById('demo-dialog');
	const openBtn = document.getElementById('dialog-open');
	const closeBtn = document.getElementById('dialog-close');
	openBtn?.addEventListener('click', () => dialog.open());
	closeBtn?.addEventListener('click', () => dialog.close());
</script>
