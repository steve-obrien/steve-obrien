<element-combobox class="relative block w-full max-w-sm">
	<input
		slot="input"
		type="text"
		placeholder="Search fruits…"
		class="h-10 w-full rounded-full border border-border bg-background px-4 pr-10 text-sm text-foreground outline-none focus:ring-2 focus:ring-ring/40"
	/>
	<button
		slot="toggle"
		type="button"
		aria-label="Show options"
		class="absolute right-1 top-1 inline-flex size-8 items-center justify-center rounded-full text-muted-foreground hover:bg-secondary"
	>
		<svg viewBox="0 0 20 20" class="size-4" fill="none">
			<path d="M6 8l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
		</svg>
	</button>
	<ul slot="list" class="z-50 max-h-[min(12rem,var(--el-floating-available-height))] overflow-auto rounded-2xl border border-border bg-background p-1 shadow-lg">
		<li data-value="1" data-label="Apple" class="cursor-pointer rounded-xl px-3 py-2 text-sm text-foreground hover:bg-secondary">Apple</li>
		<li data-value="2" data-label="Banana" class="cursor-pointer rounded-xl px-3 py-2 text-sm text-foreground hover:bg-secondary">Banana</li>
		<li data-value="3" data-label="Cherry" class="cursor-pointer rounded-xl px-3 py-2 text-sm text-foreground hover:bg-secondary">Cherry</li>
	</ul>
</element-combobox>

<script type="module">
	import '@elements/headless/combobox.js';
</script>
