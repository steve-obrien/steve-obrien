title: Human Brains, Artificial Brains, Future Brains
shortTitle: Human Brains · Artificial Brains · Future Brains
subtitle: >-
  A journey through the machinery of intelligence, from the cells inside our heads to the minds we may build
  next.
parts:
  - number: 0
    title: Introduction
    description: Why intelligence is worth looking at again, and why this is not a textbook.
    chapters:
